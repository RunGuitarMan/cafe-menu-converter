name: Verify standalone releases
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the standalone EXE and run unit tests
        shell: pwsh
        run: ./build/publish.ps1
      - name: Make installed .NET unavailable on this disposable runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Only run on a disposable CI runner' }
          dotnet build-server shutdown
          $locations = @(
            (Split-Path (Get-Command dotnet).Source),
            "$env:ProgramFiles/dotnet",
            "${env:ProgramFiles(x86)}/dotnet",
            $env:DOTNET_ROOT
          ) | Where-Object { $_ -and (Test-Path $_) } | ForEach-Object { (Resolve-Path $_).Path } | Select-Object -Unique
          foreach ($location in $locations) {
            Move-Item -LiteralPath $location -Destination "$location.disabled-for-release-test"
          }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { throw 'dotnet is still available' }
      - name: Launch the lone EXE offline, render the GUI and verify every XLSX field
        shell: pwsh
        run: python build/verify-release.py artifacts/releases/CafeMenuConverter-win-x64.exe artifacts/verification/win-x64 --block-network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-release
          path: |
            artifacts/releases/CafeMenuConverter-win-x64.exe
            artifacts/verification/win-x64/
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native macOS app and run unit tests
        run: bash build/publish.sh ${{ matrix.rid }}
      - name: Launch relocated app offline, render the GUI and verify every XLSX field
        run: python3 build/verify-release.py artifacts/releases/CafeMenuConverter-${{ matrix.rid }}.zip artifacts/verification/${{ matrix.rid }} --block-network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-release-${{ matrix.rid }}
          path: |
            artifacts/releases/CafeMenuConverter-${{ matrix.rid }}.zip
            artifacts/verification/${{ matrix.rid }}/
          if-no-files-found: error
